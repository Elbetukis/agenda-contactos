<section id="nuevoContacto" class="section">

    <div class="section-header">

        <div>

            <h2>
                Nuevo contacto
            </h2>

            <p>
                Registra un nuevo contacto en tu agenda
            </p>

        </div>

    </div>


    <div class="card formulario-card">

        <form id="contactoForm">

            <input
                type="hidden"
                id="contactoId"
            >


            <div class="form-grid">

                <div class="form-group">

                    <label for="nombre">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        placeholder="Ej. Albert Pérez"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <input
                        type="text"
                        id="telefono"
                        placeholder="Ej. 2711234567"
                        maxlength="10"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="correo">
                        Correo
                    </label>

                    <input
                        type="email"
                        id="correo"
                        placeholder="Ej. albert@gmail.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="empresa">
                        Empresa
                    </label>

                    <input
                        type="text"
                        id="empresa"
                        placeholder="Ej. OpenAI"
                    >

                </div>

            </div>


            <div
                id="modalMensaje"
                class="modal-message"
            >
            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="secondary-button"
                    id="cancelarFormulario"
                >
                    Cancelar
                </button>


                <button
                    type="submit"
                    class="primary-button"
                >
                    Guardar contacto
                </button>

            </div>

        </form>

    </div>

</section>
