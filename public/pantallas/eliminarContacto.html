            </p>

        </div>

    </div>


    <div class="card eliminar-card">

        <div class="delete-icon">
            🗑️

        </h2>

        </p>


        <div

            class="modal-message"

        <div class="modal-footer">

            <button

                class="secondary-button"
                id="cancelarEliminar"

                class="danger-button"
                id="confirmarEliminar"

                Eliminar

        </div>
