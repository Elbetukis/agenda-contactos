<section id="contactos" class="section">

    <div class="section-header">

        <div>

            <h2>
                Contactos
            </h2>

            <p>
                Administra todos tus contactos
            </p>

        </div>


        <button
            class="primary-button"
            id="btnNuevoContacto"
        >
            + Nuevo contacto
        </button>

    </div>


    <!-- BUSCADOR -->

    <div class="search-container">

        <span>
            🔍
        </span>

        <input
            type="text"
            id="buscarContacto"
            placeholder="Buscar por nombre, correo o empresa..."
        >

    </div>


    <!-- TABLA -->

    <div class="card table-card">

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            Nombre
                        </th>

                        <th>
                            Teléfono
                        </th>

                        <th>
                            Correo
                        </th>

                        <th>
                            Empresa
                        </th>

                        <th>
                            Acciones
                        </th>

                    </tr>

                </thead>


                <tbody id="tablaContactos">

                </tbody>

            </table>

        </div>

    </div>

</section>
